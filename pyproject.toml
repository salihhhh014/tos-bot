[project]
name = "tos-bot"
version = "0.1.0"
description = "Телеграм-бот: краткий разбор ToS / оферт / политик конфиденциальности"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "ToS Bot Contributors" }]
keywords = ["telegram", "aiogram", "llm", "tos", "legal", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: AsyncIO",
]

dependencies = [
  "aiogram>=3.13,<4",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "trafilatura>=1.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
tos-bot = "tos_bot.__main__:run"

[project.urls]
Homepage = "https://github.com/salihhhh014/tos-bot"
Repository = "https://github.com/salihhhh014/tos-bot"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["tos_bot"]
branch = true

[tool.coverage.report]
omit = ["*/tests/*"]
skip_covered = true
